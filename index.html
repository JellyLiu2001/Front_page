<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书签导航 - 云同步版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(at 20% 30%, rgba(102, 126, 234, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(118, 75, 162, 0.15) 0px, transparent 50%);
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-btn {
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn.google {
            background: white;
            color: #333;
        }

        .login-btn.google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }

        .login-btn.anonymous {
            background: var(--primary-gradient);
            color: white;
        }

        .login-btn.anonymous:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .sync-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            z-index: 1000;
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        .sync-indicator.syncing {
            background: #f59e0b;
        }

        .sync-indicator.offline {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .weather-widget {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 1s ease-out 0.1s both;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-details h3 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .weather-details p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .quick-links-container {
            max-width: 1200px;
            margin: 0 auto 2rem;
            animation: fadeIn 1s ease-out 0.15s both;
        }

        .quick-links-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .quick-links-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quick-link-add-btn {
            width: 32px;
            height: 32px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-link-add-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }

        .quick-link-item {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .quick-link-item:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .quick-link-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 0.5rem;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .quick-link-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .quick-link-icon.has-image {
            background: rgba(255, 255, 255, 0.1);
        }

        .quick-link-name {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quick-link-delete {
            position: absolute;
            top: 0.25rem;
            right: 0.25rem;
            width: 20px;
            height: 20px;
            background: rgba(245, 87, 108, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-link-item:hover .quick-link-delete {
            opacity: 1;
        }

        .quick-link-delete:hover {
            transform: scale(1.2);
            background: rgba(245, 87, 108, 1);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 3rem;
            position: relative;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .type-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 300;
            text-align: center;
        }

        .search-type {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            list-style: none;
        }

        .search-type input[type="radio"] {
            display: none;
        }

        .search-type label {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
            backdrop-filter: blur(10px);
            display: block;
        }

        .search-type input[type="radio"]:checked + label {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .search-type label:hover {
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .search-wrapper {
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 1.25rem 3.5rem 1.25rem 1.5rem;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .bookmarks-section {
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .btn.primary {
            background: var(--primary-gradient);
            border-color: transparent;
        }

        .btn.primary:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .category-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .category-btn:hover:not(.active) {
            background: var(--card-hover);
            color: var(--text-primary);
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .bookmark-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
        }

        .bookmark-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .bookmark-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-url {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .bookmark-footer {
            display: flex;
            gap: 0.5rem;
        }

        .bookmark-link {
            flex: 1;
            padding: 0.5rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .bookmark-link:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.4);
        }

        .bookmark-delete {
            padding: 0.5rem 1rem;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 8px;
            color: #f5576c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .bookmark-delete:hover {
            background: rgba(245, 87, 108, 0.2);
            border-color: rgba(245, 87, 108, 0.4);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--card-hover);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .category-item:hover {
            background: var(--card-hover);
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .category-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .delete-category-btn {
            padding: 0.5rem 1rem;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 8px;
            color: #f5576c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            border: none;
        }

        .delete-category-btn:hover {
            background: rgba(245, 87, 108, 0.2);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 12px;
            padding: 1rem;
            color: #f5576c;
            margin-bottom: 1rem;
        }

        @media (max-width: 1024px) {
            /* 平板横屏 */
            .container {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            /* 手机和平板竖屏 */
            .container {
                padding: 1rem;
            }

            .header {
                margin-bottom: 2rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            /* 天气组件 */
            .weather-widget {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .weather-info {
                flex-direction: column;
                text-align: center;
            }

            .weather-icon {
                font-size: 2.5rem;
            }

            /* 同步状态 */
            .sync-status {
                top: 0.5rem;
                right: 0.5rem;
                font-size: 0.75rem;
                padding: 0.4rem 0.75rem;
            }

            .user-info {
                flex-direction: column;
                gap: 0.25rem;
            }

            .user-info span {
                font-size: 0.7rem;
            }

            /* 搜索 */
            .search-container {
                margin-bottom: 2rem;
            }

            .search-type {
                gap: 0.4rem;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
                -webkit-overflow-scrolling: touch;
            }

            .search-type label {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
                white-space: nowrap;
            }

            .search-box {
                padding: 1rem 3rem 1rem 1rem;
                font-size: 1rem;
            }

            .search-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            /* 快捷链接 */
            .quick-links-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 0.75rem;
            }

            .quick-link-item {
                padding: 0.75rem;
            }

            .quick-link-icon {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .quick-link-name {
                font-size: 0.8rem;
            }

            /* 书签部分 */
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .action-buttons {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            /* 分类筛选 */
            .category-filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .category-filters::-webkit-scrollbar {
                display: none;
            }

            .category-btn {
                white-space: nowrap;
                padding: 0.6rem 1.2rem;
                font-size: 0.85rem;
            }

            /* 书签网格 */
            .bookmarks-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .bookmark-card {
                padding: 1.25rem;
            }

            .bookmark-header {
                gap: 0.75rem;
            }

            .bookmark-icon {
                width: 42px;
                height: 42px;
                font-size: 1.3rem;
            }

            .bookmark-title {
                font-size: 1rem;
            }

            .bookmark-url {
                font-size: 0.8rem;
            }

            /* 模态框 */
            .modal {
                padding: 1rem;
            }

            .modal-content {
                padding: 1.5rem;
                max-height: 85vh;
            }

            .modal-title {
                font-size: 1.3rem;
            }

            .form-group {
                margin-bottom: 1.25rem;
            }

            .form-buttons {
                flex-direction: column;
            }

            .form-buttons .btn {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            /* 小屏手机 */
            .header h1 {
                font-size: 1.75rem;
            }

            .header p {
                font-size: 0.9rem;
            }

            .quick-links-grid {
                grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
                gap: 0.5rem;
            }

            .quick-link-item {
                padding: 0.6rem;
            }

            .quick-link-icon {
                width: 36px;
                height: 36px;
                font-size: 1.1rem;
            }

            .quick-link-name {
                font-size: 0.75rem;
            }

            .section-title {
                font-size: 1.3rem;
            }

            .category-btn {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }

            .bookmark-icon {
                width: 38px;
                height: 38px;
                font-size: 1.2rem;
            }
        }

        /* 横屏优化 */
        @media (max-height: 600px) and (orientation: landscape) {
            .login-screen {
                padding: 1rem;
            }

            .login-card {
                padding: 2rem;
                max-width: 500px;
            }

            .login-card h1 {
                font-size: 2rem;
                margin-bottom: 0.25rem;
            }

            .login-card p {
                margin-bottom: 1rem;
            }

            .header {
                margin-bottom: 1.5rem;
            }

            .weather-widget {
                padding: 1rem;
            }

            .modal-content {
                max-height: 80vh;
            }
        }

        /* 触摸设备优化 */
        @media (hover: none) and (pointer: coarse) {
            /* 增大可点击区域 */
            .btn,
            .category-btn,
            .bookmark-link,
            .bookmark-delete {
                min-height: 44px;
            }

            .quick-link-item {
                min-height: 80px;
            }

            /* 移除hover效果，使用active */
            .btn:active,
            .category-btn:active,
            .quick-link-item:active {
                transform: scale(0.98);
            }

            .bookmark-card:active {
                transform: translateY(0);
            }
        }

        /* ===== MAIN TABS ===== */
        .main-tabs {

            border-radius: 8px; padding: 8px 18px; cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.15s; box-shadow: 0 2px 12px rgba(79,142,247,0.35);
        }
        .tl-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(79,142,247,0.5); }
        .tl-main-area { display: flex; flex: 1; overflow: hidden; }
        .tl-list-area { flex: 1; overflow-y: auto; background: var(--tl-bg); }

        .tl-list-act {

        .tl-list-empty-icon { font-size: 44px; margin-bottom: 12px; }

        .tl-detail-panel {
            width: 280px; background: var(--tl-bg2); border-left: 1px solid var(--tl-border);

        .tl-panel-close:hover { background: var(--tl-bg3); color: var(--tl-text); }
        .tl-panel-body { padding: 20px 20px 16px; flex: 1; }
        .tl-panel-date { font-size: 12px; color: var(--tl-text2); margin-bottom: 8px; }
        .tl-panel-title { font-size: 18px; font-weight: 700; color: var(--tl-text); line-height: 1.3; margin-bottom: 12px; }
        .tl-panel-desc { font-size: 13px; color: var(--tl-text2); line-height: 1.6; white-space: pre-wrap; }
        .tl-panel-actions { padding: 16px 20px; display: flex; gap: 8px; border-top: 1px solid var(--tl-border); }
        .tl-btn-sm {

            cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s;
        }
        .tl-btn-edit { background: var(--tl-bg3); color: var(--tl-text); }
        .tl-btn-edit:hover { background: var(--tl-accent); border-color: var(--tl-accent); color: #fff; }
        .tl-btn-delete { background: var(--tl-bg3); color: var(--tl-text2); }
        .tl-btn-delete:hover { background: #c0392b; border-color: #c0392b; color: #fff; }
        .tl-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .tl-modal-overlay.visible { display: flex; }
        .tl-modal {
            background: var(--tl-bg2); border: 1px solid var(--tl-border); border-radius: 16px;
            width: 480px; max-width: 95vw; box-shadow: 0 20px 60px rgba(0,0,0,0.6);

        .tl-modal-header { padding: 20px 20px 0; display: flex; align-items: center; justify-content: space-between; }
        .tl-modal-title { font-size: 18px; font-weight: 700; color: var(--tl-text); }
        .tl-modal-close {
            background: none; border: none; color: var(--tl-text2); font-size: 18px;
            cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.1s;
        }
        .tl-modal-close:hover { background: var(--tl-bg3); color: var(--tl-text); }
        .tl-modal-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .tl-form-row { display: flex; gap: 12px; }
        .tl-form-row .tl-form-group { flex: 1; }
        .tl-form-group { display: flex; flex-direction: column; gap: 6px; }
        .tl-form-group label { font-size: 13px; font-weight: 500; color: var(--tl-text2); }

        /* ===== JOURNAL ===== */
        .journal-container { max-width: 800px; margin: 0 auto; padding: 2rem; }
        .journal-today-card {
            background: var(--bg-card); border: 1px solid var(--border-color);

            font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 700;

        /* ===== TODO ===== */
        .todo-container { max-width: 800px; margin: 0 auto; padding: 2rem; }

            display: flex; justify-content: space-between; align-items: center;

        .todo-priority-select {
            padding: 0.75rem; background: rgba(255,255,255,0.07);

            color: var(--text-primary); font-size: 0.9rem; cursor: pointer; outline: none;

        .todo-priority-select option { background: #1a1a3e; }

        .todo-filter-btn.active { background: var(--primary-gradient); border-color: transparent; color: white; }
        .todo-filter-btn:hover:not(.active) { background: var(--card-hover); color: var(--text-primary); }
        .todo-list { display: flex; flex-direction: column; gap: 0.75rem; }

        .todo-item:hover { background: var(--card-hover); }

        .todo-checkbox {
            width: 22px; height: 22px; border-radius: 50%;

        // 登录相关
        window.loginWithGoogle = async function () {
            const provider = new GoogleAuthProvider();
            try {
                document.getElementById('loginError').textContent = '';
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登录错误:', error);
                document.getElementById('loginError').textContent = '登录失败: ' + error.message;
            }
        };

        window.loginAnonymously = async function () {
            try {
                document.getElementById('loginError').textContent = '';
                await signInAnonymously(auth);
            } catch (error) {
                console.error('登录错误:', error);
                document.getElementById('loginError').textContent = '登录失败: ' + error.message;
            }
        };

        window.logout = async function () {
            if (confirm('确定要登出吗？')) {
                await signOut(auth);
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        };

        // 监听认证状态
        onAuthStateChanged(auth, async (user) => {
            console.log('🔐 认证状态变化:', user ? '已登录' : '未登录');
            if (user) {
                console.log('👤 用户信息:', user.email || '匿名用户');
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';

                const email = user.email || '匿名用户';
                document.getElementById('userEmail').textContent = email;

                // 绑定登出按钮
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.onclick = async () => {
                        if (confirm('确定要登出吗？')) {
                            await signOut(auth);
                        }
                    };
                }

                console.log('📥 开始加载用户数据...');
                await loadUserData();
                console.log('🎬 开始初始化界面...');
                init();
                console.log('✅ 初始化完成！');
            } else {
                currentUser = null;
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        // 加载用户数据
        async function loadUserData() {
            if (!currentUser) return;

            updateSyncStatus('syncing', '同步中...');

            try {
                const userRef = ref(database, `users/${currentUser.uid}`);
                console.log('📡 正在从Firebase获取数据...');
                const snapshot = await get(userRef);

                function parseTlEvents(raw) {
                    return (raw || []).map(e => ({
                        ...e,
                        start: new Date(e.start),
                        end: e.end ? new Date(e.end) : null
                    }));
                }

                if (snapshot.exists()) {
                    console.log('✅ 找到用户数据');
                    const data = snapshot.val();
                    bookmarks = data.bookmarks || defaultBookmarks;
                    quickLinks = data.quickLinks || defaultQuickLinks;
                    tlState.events = parseTlEvents(data.events);
                    todos = data.todos || [];
                    journal = data.journal || {};
                } else {
                    console.log('ℹ️ 新用户，使用默认数据');
                    bookmarks = JSON.parse(JSON.stringify(defaultBookmarks));
                    quickLinks = JSON.parse(JSON.stringify(defaultQuickLinks));
                    await saveUserData();
                }

                // 监听数据变化
                onValue(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        bookmarks = data.bookmarks || [];
                        quickLinks = data.quickLinks || [];
                        tlState.events = parseTlEvents(data.events);
                        todos = data.todos || [];
                        journal = data.journal || {};
                        renderQuickLinks();
                        setupCategoryFilters();
                        renderTimeline();
                        renderTodos();
                        if (document.getElementById('tab-journal').classList.contains('active')) {
                            renderJournalPastEntries();
                        }
                    }
                });

                updateSyncStatus('synced', '已同步');
            } catch (error) {
                console.error('加载数据错误:', error);
                updateSyncStatus('offline', '同步失败');
            }
        }

        // 保存用户数据
        async function saveUserData() {
            if (!currentUser) return;

            updateSyncStatus('syncing', '保存中...');

            try {
                const userRef = ref(database, `users/${currentUser.uid}`);
                await set(userRef, {
                    bookmarks: bookmarks,
                    quickLinks: quickLinks,
                    events: tlState.events.map(e => ({
                        ...e,
                        start: e.start instanceof Date ? e.start.toISOString() : e.start,
                        end: e.end instanceof Date ? e.end.toISOString() : (e.end || null)
                    })),
                    todos: todos,
                    journal: journal,
                    lastUpdated: new Date().toISOString()
                });
                updateSyncStatus('synced', '已同步');
            } catch (error) {
                console.error('保存数据错误:', error);
                updateSyncStatus('offline', '保存失败');
            }
        }

        // 更新同步状态
        function updateSyncStatus(status, text) {
            const indicator = document.getElementById('syncIndicator');
            const syncText = document.getElementById('syncText');

            indicator.className = 'sync-indicator ' + status;
            syncText.textContent = text;
        }

        // 初始化
        function init() {
            setupSearch();
            setupWeather();
            setupQuickLinks();
            setupCategoryFilters();
            renderQuickLinks();
            setupMainTabs();
            initTimeline();
            renderTodos();
            setupTodoHandlers();
        }

        // 搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const searchTypeInputs = document.querySelectorAll('input[name="type"]');

            // 更新placeholder
            searchTypeInputs.forEach(input => {
                input.addEventListener('change', function () {
                    const placeholder = this.getAttribute('data-placeholder');
                    searchInput.placeholder = placeholder;
                });
            });

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;

                const selectedEngine = document.querySelector('input[name="type"]:checked');
                const searchUrl = selectedEngine.value + encodeURIComponent(query);
                window.open(searchUrl, '_blank');
            }

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
        }

        // ===== TIMELINE =====
        function initTimeline() {
            if (tlInitialized) { renderTimeline(); return; }

            tlModalOverlay = document.getElementById('tl-modal-overlay');

        function renderTimeline() {
            renderTlList();
        }

        function renderTlList() {
            const container = document.getElementById('tl-list-container');
            if (!container) return;

            if (tlState.events.length === 0) {
                container.innerHTML = `<div class="tl-list-empty"><div class="tl-list-empty-icon">📅</div><div class="tl-list-empty-text">点击右上角「+ 添加事件」开始创建你的时间轴</div></div>`;
                return;
            }

            const sorted = [...tlState.events].sort((a, b) =>
                tlSortDesc ? b.start - a.start : a.start - b.start
            );

            container.innerHTML = '';
            let curYear = null, curMonth = null;
            const MONTHS = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

            sorted.forEach(ev => {
                const y = ev.start.getFullYear();
                const mo = ev.start.getMonth();
                const d = ev.start.getDate();

                if (y !== curYear) {
                    curYear = y; curMonth = null;
                    const yEl = document.createElement('div');
                    yEl.className = 'tl-list-year';
                    yEl.textContent = y + ' 年';
                    container.appendChild(yEl);
                }
                if (mo !== curMonth) {
                    curMonth = mo;
                    const mEl = document.createElement('div');
                    mEl.className = 'tl-list-month';
                    mEl.textContent = MONTHS[mo];
                    container.appendChild(mEl);
                }

                const item = document.createElement('div');
                item.className = 'tl-list-item' + (ev.id === tlState.selectedId ? ' tl-selected' : '');
                item.dataset.id = ev.id;

                // 色块
                const dot = document.createElement('div');
                dot.className = 'tl-list-dot';
                dot.style.background = ev.color;

                // 日期
                const dateEl = document.createElement('div');
                dateEl.className = 'tl-list-date';
                dateEl.textContent = String(mo + 1).padStart(2, '0') + '/' + String(d).padStart(2, '0');

                // 内容区
                const content = document.createElement('div');
                content.className = 'tl-list-content';

                const titleRow = document.createElement('div');
                titleRow.className = 'tl-list-title';

                const bar = document.createElement('div');
                bar.className = 'tl-list-color-bar';
                bar.style.background = ev.color;

                const titleText = document.createElement('span');
                titleText.textContent = ev.title;

                titleRow.appendChild(bar);
                titleRow.appendChild(titleText);

                if (ev.end && ev.end > ev.start) {
                    const tag = document.createElement('span');
                    tag.className = 'tl-list-range-tag';
                    const days = Math.round((ev.end - ev.start) / 86400000);
                    tag.textContent = `持续 ${days} 天`;
                    titleRow.appendChild(tag);
                }

                content.appendChild(titleRow);

                if (ev.desc) {
                    const desc = document.createElement('div');
                    desc.className = 'tl-list-desc';
                    desc.textContent = ev.desc;
                    content.appendChild(desc);
                }

                // 操作按钮
                const actions = document.createElement('div');
                actions.className = 'tl-list-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'tl-list-act';
                editBtn.textContent = '编辑';
                editBtn.addEventListener('click', e => { e.stopPropagation(); tlOpenModal(ev.id); });

                const delBtn = document.createElement('button');
                delBtn.className = 'tl-list-act del';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', async e => {
                    e.stopPropagation();
                    if (confirm(`确定删除「${ev.title}」？`)) {
                        tlState.events = tlState.events.filter(x => x.id !== ev.id);
                        if (tlState.selectedId === ev.id) { tlState.selectedId = null; tlDetailPanel.classList.remove('visible'); }
                        await saveUserData();
                        renderTlList();
                    }
                });

                actions.appendChild(editBtn);
                actions.appendChild(delBtn);

                item.appendChild(dot);
                item.appendChild(dateEl);
                item.appendChild(content);
                item.appendChild(actions);

                item.addEventListener('click', () => tlSelectEvent(ev.id));
                container.appendChild(item);
            });
        }

        function tlSelectEvent(id) {
            // 如果再次点击同一项则关闭面板
            if (tlState.selectedId === id) { tlClosePanel(); return; }
            tlState.selectedId = id;
            const ev = tlState.events.find(e => e.id === id);
            if (!ev) return;
            document.getElementById('tl-panel-color-bar').style.background = ev.color;
            document.getElementById('tl-panel-date').textContent = ev.end
                ? `${tlFormatDate(ev.start)} — ${tlFormatDate(ev.end)}`
                : tlFormatDate(ev.start);
            document.getElementById('tl-panel-title').textContent = ev.title;
            document.getElementById('tl-panel-desc').textContent  = ev.desc || '（无描述）';
            tlDetailPanel.classList.add('visible');
            // 更新列表高亮
            document.querySelectorAll('.tl-list-item').forEach(el => {
                el.classList.toggle('tl-selected', el.dataset.id === id);
            });
        }

        function tlClosePanel() {
            tlState.selectedId = null;
            tlDetailPanel.classList.remove('visible');
            document.querySelectorAll('.tl-list-item').forEach(el => el.classList.remove('tl-selected'));
        }

        function tlFormatDate(d) {
            if (!d) return '';
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function tlOpenModal(editId=null) {
            tlState.editingId = editId;
            const ev = editId ? tlState.events.find(e => e.id===editId) : null;
            document.getElementById('tl-modal-title').textContent = ev ? '编辑事件' : '添加事件';
            document.getElementById('tl-input-title').value = ev ? ev.title : '';
            document.getElementById('tl-input-start').value = ev ? tlFormatDate(ev.start) : tlFormatDate(new Date());
            document.getElementById('tl-input-end').value   = ev && ev.end ? tlFormatDate(ev.end) : '';
            document.getElementById('tl-input-desc').value  = ev ? (ev.desc||'') : '';
            const color = ev ? ev.color : '#4f8ef7';
            tlState.selectedColor = color;
            document.querySelectorAll('.tl-color-swatch').forEach(sw => {
                sw.classList.toggle('selected', sw.dataset.color === color);
            });
            tlModalOverlay.classList.add('visible');
            document.getElementById('tl-input-title').focus();
        }

        function tlCloseModal() {
            tlModalOverlay.classList.remove('visible');
            tlState.editingId = null;
        }

        async function tlSaveModal() {
            const title = document.getElementById('tl-input-title').value.trim();
            const startVal = document.getElementById('tl-input-start').value;
            if (!title) { tlShake(document.getElementById('tl-input-title')); return; }
            if (!startVal) { tlShake(document.getElementById('tl-input-start')); return; }
            const start = new Date(startVal + 'T00:00:00');
            const endVal = document.getElementById('tl-input-end').value;
            const end = endVal ? new Date(endVal + 'T00:00:00') : null;
            const desc = document.getElementById('tl-input-desc').value.trim();
            const color = tlState.selectedColor;
            if (tlState.editingId) {
                const idx = tlState.events.findIndex(e => e.id === tlState.editingId);
                if (idx !== -1) {
                    tlState.events[idx] = { ...tlState.events[idx], title, start, end, desc, color };
                    if (tlState.selectedId === tlState.editingId) tlSelectEvent(tlState.editingId);
                }
            } else {
                tlState.events.push({ id: Date.now()+Math.random(), title, start, end, desc, color });
                tlCenterOnDate(start);
            }
            await saveUserData();
            tlCloseModal();
            renderTimeline();
        }

        function tlShake(el) {
            el.style.animation = 'none'; el.offsetHeight;
            el.style.animation = 'tlShakeAnim 0.3s ease';
            setTimeout(() => { el.style.animation = ''; }, 400);
        }

        function bindTimelineEvents() {
            document.getElementById('tl-btn-add-event').addEventListener('click', () => tlOpenModal());
            document.getElementById('tl-btn-sort').addEventListener('click', () => {
                tlSortDesc = !tlSortDesc;
                document.getElementById('tl-btn-sort').textContent = tlSortDesc ? '最新优先 ↓' : '最旧优先 ↑';
                renderTlList();
            });
            document.getElementById('tl-panel-close').addEventListener('click', tlClosePanel);
            document.getElementById('tl-panel-edit').addEventListener('click', () => {
                if (tlState.selectedId) tlOpenModal(tlState.selectedId);
            });
            document.getElementById('tl-panel-delete').addEventListener('click', async () => {
                if (tlState.selectedId) {
                    tlState.events = tlState.events.filter(e => e.id !== tlState.selectedId);
                    await saveUserData(); tlClosePanel(); renderTlList();
                }
            });
            document.getElementById('tl-modal-close').addEventListener('click', tlCloseModal);
            document.getElementById('tl-btn-cancel').addEventListener('click', tlCloseModal);
            document.getElementById('tl-btn-save').addEventListener('click', tlSaveModal);
            tlModalOverlay.addEventListener('click', e => { if (e.target === tlModalOverlay) tlCloseModal(); });
            document.querySelectorAll('.tl-color-swatch').forEach(sw => {
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.tl-color-swatch').forEach(s => s.classList.remove('selected'));
                    sw.classList.add('selected');
                    tlState.selectedColor = sw.dataset.color;
                });
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    if (tlModalOverlay.classList.contains('visible')) { tlCloseModal(); return; }
                    if (tlState.selectedId) { tlClosePanel(); return; }
                }
                if (e.key === 'Enter' && tlModalOverlay.classList.contains('visible')) tlSaveModal();
            });

            // Inject shake keyframe
            const sty = document.createElement('style');
            sty.textContent = `@keyframes tlShakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }`;
            document.head.appendChild(sty);
        }

        // ===== JOURNAL =====
        function journalTodayKeyFn() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function formatJournalDate(key) {
            const [y, m, d] = key.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            return `${y}年${m}月${d}日  ${weekdays[date.getDay()]}`;
        }

        function setupJournal() {
            journalTodayKey = journalTodayKeyFn();
            document.getElementById('journal-today-label').textContent = formatJournalDate(journalTodayKey);

            const textarea = document.getElementById('journal-textarea');
            const todayEntry = journal[journalTodayKey];
            if (todayEntry) {
                textarea.value = todayEntry.text || '';
                journalUpdateWordCount(textarea.value);
                if (todayEntry.mood) {
                    document.querySelectorAll('.journal-mood-btn').forEach(btn => {
                        btn.classList.toggle('selected', btn.dataset.mood === todayEntry.mood);
                    });
                }
                if (todayEntry.text) {
                    const s = document.getElementById('journal-save-status');
                    s.textContent = '已同步 ✓'; s.className = 'journal-save-status saved';
                }
            }

            textarea.addEventListener('input', () => {
                journalUpdateWordCount(textarea.value);
                const s = document.getElementById('journal-save-status');
                s.textContent = '编辑中...'; s.className = 'journal-save-status';
                clearTimeout(journalSaveTimer);
                journalSaveTimer = setTimeout(journalSaveToday, 1500);
            });

            document.querySelectorAll('.journal-mood-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const wasSelected = btn.classList.contains('selected');
                    document.querySelectorAll('.journal-mood-btn').forEach(b => b.classList.remove('selected'));
                    if (!wasSelected) btn.classList.add('selected');
                    clearTimeout(journalSaveTimer);
                    journalSaveTimer = setTimeout(journalSaveToday, 600);
                });
            });

            renderJournalPastEntries();
        }

        function journalUpdateWordCount(text) {
            document.getElementById('journal-wordcount').textContent = (text.trim().length || 0) + ' 字';
        }

        async function journalSaveToday() {
            const text = document.getElementById('journal-textarea').value;
            const selectedMood = document.querySelector('.journal-mood-btn.selected');
            const mood = selectedMood ? selectedMood.dataset.mood : '';
            const s = document.getElementById('journal-save-status');
            s.textContent = '保存中...'; s.className = 'journal-save-status saving';
            journal[journalTodayKey] = { text, mood, updatedAt: new Date().toISOString() };
            await saveUserData();
            s.textContent = '已保存 ✓'; s.className = 'journal-save-status saved';
            renderJournalPastEntries();
        }

        function renderJournalPastEntries() {
            const list = document.getElementById('journal-past-list');
            if (!list) return;
            const today = journalTodayKey || journalTodayKeyFn();
            const pastKeys = Object.keys(journal)
                .filter(k => k !== today && journal[k] && journal[k].text)
                .sort((a, b) => b.localeCompare(a));

            if (pastKeys.length === 0) {
                list.innerHTML = '<div class="journal-empty">还没有往日记录，坚持写下去吧 ✨</div>';
                return;
            }

            list.innerHTML = '';
            pastKeys.forEach(key => {
                const entry = journal[key];
                const preview = entry.text.replace(/\n/g,' ').slice(0,60) + (entry.text.length > 60 ? '...' : '');
                const card = document.createElement('div');
                card.className = 'journal-past-card';
                card.innerHTML = `
                    <div class="journal-past-header">
                        <div class="journal-past-date">${formatJournalDate(key)}</div>
                        <div class="journal-past-right">
                            ${entry.mood ? `<span class="journal-past-mood">${entry.mood}</span>` : ''}
                            <span class="journal-past-preview">${escapeHtml(preview)}</span>
                            <span class="journal-past-toggle">▼</span>
                        </div>
                    </div>
                    <div class="journal-past-body">
                        <div class="journal-past-text">${escapeHtml(entry.text)}</div>
                    </div>
                `;
                const header = card.querySelector('.journal-past-header');
                const body   = card.querySelector('.journal-past-body');
                const toggle = card.querySelector('.journal-past-toggle');
                const previewEl = card.querySelector('.journal-past-preview');
                header.addEventListener('click', () => {
                    const open = body.classList.toggle('open');
                    toggle.textContent = open ? '▲' : '▼';
                    previewEl.style.display = open ? 'none' : '';
                });
                list.appendChild(card);
            });
        }

        // ===== TODOS =====
        function renderTodos() {
            const list = document.getElementById('todoList');
            const stats = document.getElementById('todoStats');
            const footer = document.getElementById('todoFooter');
            if (!list) return;

            const active = todos.filter(t => !t.completed).length;
            const hasCompleted = todos.some(t => t.completed);
            stats.textContent = `${active} 项未完成`;
            footer.style.display = hasCompleted ? 'block' : 'none';

            let filtered = todos;
            if (todoFilter === 'active')    filtered = todos.filter(t => !t.completed);
            if (todoFilter === 'completed') filtered = todos.filter(t => t.completed);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="todo-empty"><div class="todo-empty-icon">🎉</div>${todoFilter==='completed'?'还没有完成的任务':todoFilter==='active'?'所有任务都完成了！':'点击上方添加你的第一个待办事项'}</div>`;
                return;
            }

            list.innerHTML = '';
            filtered.forEach(todo => {
                const item = document.createElement('div');
                item.className = 'todo-item' + (todo.completed ? ' completed' : '');
                item.innerHTML = `
                    <button class="todo-checkbox" data-id="${todo.id}" title="标记完成">${todo.completed?'✓':''}</button>
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <span class="todo-priority-badge ${todo.priority}">${todo.priority==='high'?'高优先级':todo.priority==='low'?'低优先级':''}</span>
                    <button class="todo-delete-btn" data-id="${todo.id}" title="删除">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function setupTodoHandlers() {
            const addBtn = document.getElementById('todoAddBtn');
            const input  = document.getElementById('todoInput');
            if (!addBtn) return;

            const addTodo = async () => {
                const text = input.value.trim();
                if (!text) { input.focus(); return; }
                const priority = document.getElementById('todoPriority').value;
                todos.unshift({ id: `${Date.now()}_${Math.random().toString(36).slice(2)}`, text, priority, completed: false, createdAt: new Date().toISOString() });
                input.value = '';
                await saveUserData();
                renderTodos();
            };

            addBtn.addEventListener('click', addTodo);
            input.addEventListener('keydown', e => { if (e.key==='Enter') addTodo(); });

            document.getElementById('todoList').addEventListener('click', async e => {
                const checkBtn = e.target.closest('.todo-checkbox');
                const delBtn   = e.target.closest('.todo-delete-btn');
                if (checkBtn) {
                    const id = checkBtn.dataset.id;
                    const t = todos.find(t => String(t.id) === id);
                    if (t) { t.completed = !t.completed; await saveUserData(); renderTodos(); }
                }
                if (delBtn) {
                    const id = delBtn.dataset.id;
                    todos = todos.filter(t => String(t.id) !== id);
                    await saveUserData(); renderTodos();
                }
            });

            document.querySelectorAll('.todo-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.todo-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    todoFilter = btn.dataset.filter;
                    renderTodos();
                });
            });

            document.getElementById('clearCompletedBtn').addEventListener('click', async () => {
                todos = todos.filter(t => !t.completed);
                await saveUserData(); renderTodos();
            });
        }
    </script>
</body>

</html>
