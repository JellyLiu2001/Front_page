<!DOCTYPE html><html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的书签导航 - 云同步版</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-dark: #0f0f23;
            --bg-card: rgba(255, 255, 255, 0.05);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            background-image:
                radial-gradient(at 20% 30%, rgba(102, 126, 234, 0.15) 0px, transparent 50%),
                radial-gradient(at 80% 70%, rgba(118, 75, 162, 0.15) 0px, transparent 50%);
        }

        /* Login Screen */
        .login-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3rem;
            max-width: 400px;
            width: 100%;
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-btn {
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .login-btn.google {
            background: white;
            color: #333;
        }

        .login-btn.google:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
        }

        .login-btn.anonymous {
            background: var(--primary-gradient);
            color: white;
        }

        .login-btn.anonymous:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.4);
        }

        .sync-status {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 0.5rem 1rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            z-index: 1000;
        }

        .sync-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s ease-in-out infinite;
        }

        .sync-indicator.syncing {
            background: #f59e0b;
        }

        .sync-indicator.offline {
            background: #ef4444;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logout-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            font-weight: 300;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .weather-widget {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: fadeIn 1s ease-out 0.1s both;
        }

        .weather-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .weather-icon {
            font-size: 3rem;
        }

        .weather-details h3 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }

        .weather-details p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .weather-temp {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .quick-links-container {
            max-width: 1200px;
            margin: 0 auto 2rem;
            animation: fadeIn 1s ease-out 0.15s both;
        }

        .quick-links-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding: 0 0.5rem;
        }

        .quick-links-header h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .quick-link-add-btn {
            width: 32px;
            height: 32px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-link-add-btn:hover {
            transform: scale(1.1) rotate(90deg);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .quick-links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }

        .quick-link-item {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .quick-link-item:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
        }

        .quick-link-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 0.5rem;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        .quick-link-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .quick-link-icon.has-image {
            background: rgba(255, 255, 255, 0.1);
        }

        .quick-link-name {
            font-size: 0.875rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .quick-link-delete {
            position: absolute;
            top: 0.25rem;
            right: 0.25rem;
            width: 20px;
            height: 20px;
            background: rgba(245, 87, 108, 0.9);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 0.75rem;
            cursor: pointer;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-link-item:hover .quick-link-delete {
            opacity: 1;
        }

        .quick-link-delete:hover {
            transform: scale(1.2);
            background: rgba(245, 87, 108, 1);
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 3rem;
            position: relative;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .type-text {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 300;
            text-align: center;
        }

        .search-type {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            flex-wrap: wrap;
            list-style: none;
        }

        .search-type input[type="radio"] {
            display: none;
        }

        .search-type label {
            padding: 0.5rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
            backdrop-filter: blur(10px);
            display: block;
        }

        .search-type input[type="radio"]:checked + label {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .search-type label:hover {
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .search-wrapper {
            position: relative;
        }

        .search-box {
            width: 100%;
            padding: 1.25rem 3.5rem 1.25rem 1.5rem;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-primary);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .search-box:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            transform: translateY(-50%) scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .bookmarks-section {
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: var(--card-hover);
            transform: translateY(-2px);
        }

        .btn.primary {
            background: var(--primary-gradient);
            border-color: transparent;
        }

        .btn.primary:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .category-filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .category-btn {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .category-btn.active {
            background: var(--primary-gradient);
            color: white;
            border-color: transparent;
        }

        .category-btn:hover:not(.active) {
            background: var(--card-hover);
            color: var(--text-primary);
        }

        .bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .bookmark-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
        }

        .bookmark-card:hover {
            transform: translateY(-4px);
            background: var(--card-hover);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.15);
        }

        .bookmark-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .bookmark-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            flex-shrink: 0;
        }

        .bookmark-info {
            flex: 1;
            min-width: 0;
        }

        .bookmark-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-url {
            font-size: 0.85rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .bookmark-desc {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .bookmark-footer {
            display: flex;
            gap: 0.5rem;
        }

        .bookmark-link {
            flex: 1;
            padding: 0.5rem;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .bookmark-link:hover {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.4);
        }

        .bookmark-delete {
            padding: 0.5rem 1rem;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 8px;
            color: #f5576c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .bookmark-delete:hover {
            background: rgba(245, 87, 108, 0.2);
            border-color: rgba(245, 87, 108, 0.4);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--card-hover);
            transform: rotate(90deg);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .form-buttons {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .categories-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .category-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .category-item:hover {
            background: var(--card-hover);
        }

        .category-info {
            flex: 1;
        }

        .category-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .category-count {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .delete-category-btn {
            padding: 0.5rem 1rem;
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 8px;
            color: #f5576c;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.2rem;
            border: none;
        }

        .delete-category-btn:hover {
            background: rgba(245, 87, 108, 0.2);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .error-message {
            background: rgba(245, 87, 108, 0.1);
            border: 1px solid rgba(245, 87, 108, 0.2);
            border-radius: 12px;
            padding: 1rem;
            color: #f5576c;
            margin-bottom: 1rem;
        }

        @media (max-width: 1024px) {
            /* 平板横屏 */
            .container {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .bookmarks-grid {
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            }
        }

        @media (max-width: 768px) {
            /* 手机和平板竖屏 */
            .container {
                padding: 1rem;
            }

            .header {
                margin-bottom: 2rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            /* 天气组件 */
            .weather-widget {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }

            .weather-info {
                flex-direction: column;
                text-align: center;
            }

            .weather-icon {
                font-size: 2.5rem;
            }

            /* 同步状态 */
            .sync-status {
                top: 0.5rem;
                right: 0.5rem;
                font-size: 0.75rem;
                padding: 0.4rem 0.75rem;
            }

            .user-info {
                flex-direction: column;
                gap: 0.25rem;
            }

            .user-info span {
                font-size: 0.7rem;
            }

            /* 搜索 */
            .search-container {
                margin-bottom: 2rem;
            }

            .search-type {
                gap: 0.4rem;
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
                -webkit-overflow-scrolling: touch;
            }

            .search-type label {
                padding: 0.4rem 0.8rem;
                font-size: 0.8rem;
                white-space: nowrap;
            }

            .search-box {
                padding: 1rem 3rem 1rem 1rem;
                font-size: 1rem;
            }

            .search-btn {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            /* 快捷链接 */
            .quick-links-grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 0.75rem;
            }

            .quick-link-item {
                padding: 0.75rem;
            }

            .quick-link-icon {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .quick-link-name {
                font-size: 0.8rem;
            }

            /* 书签部分 */
            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .section-title {
                font-size: 1.5rem;
            }

            .action-buttons {
                width: 100%;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            /* 分类筛选 */
            .category-filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 0.5rem;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }

            .category-filters::-webkit-scrollbar {
                display: none;
            }

            .category-btn {
                white-space: nowrap;

            const provider = new GoogleAuthProvider();

                document.getElementById('loginError').textContent = '';
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error('登录错误:', error);
                document.getElementById('loginError').textContent = '登录失败: ' + error.message;
            }
        };

        window.loginAnonymously = async function () {
            try {
                document.getElementById('loginError').textContent = '';
                await signInAnonymously(auth);
            } catch (error) {
                console.error('登录错误:', error);
                document.getElementById('loginError').textContent = '登录失败: ' + error.message;
            }
        };

        window.logout = async function () {
            if (confirm('确定要登出吗？')) {
                await signOut(auth);
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';

        };

        // 监听认证状态
        onAuthStateChanged(auth, async (user) => {
            console.log('🔐 认证状态变化:', user ? '已登录' : '未登录');
            if (user) {
                console.log('👤 用户信息:', user.email || '匿名用户');
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';

                const email = user.email || '匿名用户';
                document.getElementById('userEmail').textContent = email;

                // 绑定登出按钮
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.onclick = async () => {
                        if (confirm('确定要登出吗？')) {
                            await signOut(auth);
                        }
                    };
                }

                console.log('📥 开始加载用户数据...');
                await loadUserData();
                console.log('🎬 开始初始化界面...');
                init();
                console.log('✅ 初始化完成！');
            } else {
                currentUser = null;
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        // 加载用户数据
        async function loadUserData() {
            if (!currentUser) return;

            updateSyncStatus('syncing', '同步中...');

            try {
                const userRef = ref(database, `users/${currentUser.uid}`);
                console.log('📡 正在从Firebase获取数据...');
                const snapshot = await get(userRef);

                function parseTlEvents(raw) {
                    return (raw || []).map(e => ({
                        ...e,
                        start: new Date(e.start),
                        end: e.end ? new Date(e.end) : null
                    }));
                }

                if (snapshot.exists()) {
                    console.log('✅ 找到用户数据');
                    const data = snapshot.val();
                    bookmarks = data.bookmarks || defaultBookmarks;
                    quickLinks = data.quickLinks || defaultQuickLinks;
                    tlState.events = parseTlEvents(data.events);
                    todos = data.todos || [];
                } else {
                    console.log('ℹ️ 新用户，使用默认数据');
                    bookmarks = JSON.parse(JSON.stringify(defaultBookmarks));
                    quickLinks = JSON.parse(JSON.stringify(defaultQuickLinks));
                    await saveUserData();
                }

                // 监听数据变化
                onValue(userRef, (snapshot) => {
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        bookmarks = data.bookmarks || [];
                        quickLinks = data.quickLinks || [];
                        tlState.events = parseTlEvents(data.events);
                        todos = data.todos || [];
                        renderQuickLinks();
                        setupCategoryFilters();
                        renderTimeline();
                        renderTodos();
                    }
                });

                updateSyncStatus('synced', '已同步');
            } catch (error) {
                console.error('加载数据错误:', error);
                updateSyncStatus('offline', '同步失败');
            }
        }

        // 保存用户数据
        async function saveUserData() {
            if (!currentUser) return;

            updateSyncStatus('syncing', '保存中...');

            try {
                const userRef = ref(database, `users/${currentUser.uid}`);
                await set(userRef, {
                    bookmarks: bookmarks,
                    quickLinks: quickLinks,
                    events: tlState.events.map(e => ({
                        ...e,
                        start: e.start instanceof Date ? e.start.toISOString() : e.start,
                        end: e.end instanceof Date ? e.end.toISOString() : (e.end || null)
                    })),
                    todos: todos,
                    lastUpdated: new Date().toISOString()
                });
                updateSyncStatus('synced', '已同步');
            } catch (error) {
                console.error('保存数据错误:', error);
                updateSyncStatus('offline', '保存失败');
            }
        }

            syncText.textContent = text;
        }

        // 搜索功能
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const searchTypeInputs = document.querySelectorAll('input[name="type"]');

            // 更新placeholder
            searchTypeInputs.forEach(input => {
                input.addEventListener('change', function () {
                    const placeholder = this.getAttribute('data-placeholder');
                    searchInput.placeholder = placeholder;
                });
            });

            function performSearch() {
                const query = searchInput.value.trim();
                if (!query) return;

                const selectedEngine = document.querySelector('input[name="type"]:checked');
                const searchUrl = selectedEngine.value + encodeURIComponent(query);
                window.open(searchUrl, '_blank');
            }

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
        }

        // 常用网站功能
        function renderQuickLinks() {
            const grid = document.getElementById('quickLinksGrid');
            grid.innerHTML = '';

            quickLinks.forEach((link, index) => {
                const item = document.createElement('a');
                item.className = 'quick-link-item';
                item.href = link.url;
                item.target = '_blank';

                const icon = document.createElement('div');
                icon.className = 'quick-link-icon';

                if (link.icon) {
                    icon.textContent = link.icon;
                } else {
                    try {
                        const url = new URL(link.url);
                        const img = document.createElement('img');
                        img.src = `https://www.google.com/s2/favicons?domain=${url.hostname}&sz=128`;
                        img.alt = link.name;
                        img.onload = () => icon.classList.add('has-image');
                        icon.appendChild(img);
                    } catch (e) {
                        icon.textContent = '🔗';
                    }
                }

                const name = document.createElement('div');
                name.className = 'quick-link-name';
                name.textContent = link.name;

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'quick-link-delete';
                deleteBtn.textContent = '×';
                deleteBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    deleteQuickLink(index);
                });

                item.appendChild(deleteBtn);
                item.appendChild(icon);
                item.appendChild(name);
                grid.appendChild(item);
            });
        }

        function setupQuickLinks() {
            const addBtn = document.getElementById('addQuickLinkBtn');
            const modal = document.getElementById('addQuickLinkModal');
            const closeBtn = document.getElementById('closeQuickLinkModalBtn');
            const form = document.getElementById('addQuickLinkForm');

            addBtn.addEventListener('click', () => modal.classList.add('active'));
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('active');
                form.reset();
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newLink = {
                    name: document.getElementById('quickLinkName').value,
                    url: document.getElementById('quickLinkUrl').value,
                    icon: document.getElementById('quickLinkIcon').value || null
                };
                quickLinks.push(newLink);
                await saveUserData();
                renderQuickLinks();

        // ===== 数据导入/导出 =====
        // 导出全部数据（书签、常用网站、时间轴、待办）为 JSON 文件
        window.exportAllData = function () {
            const exportData = {
                type: 'bookmark-homepage-backup',
                version: 1,
                exportedAt: new Date().toISOString(),
                bookmarks: bookmarks,
                quickLinks: quickLinks,
                events: tlState.events.map(e => ({
                    ...e,
                    start: e.start instanceof Date ? e.start.toISOString() : e.start,
                    end: e.end instanceof Date ? e.end.toISOString() : (e.end || null)
                })),
                todos: todos
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const dateStr = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `书签导航备份_${dateStr}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        };

        // 导入数据：读取 JSON 文件并合并/覆盖当前数据
        window.importAllData = function (event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = JSON.parse(e.target.result);

                    if (!data || typeof data !== 'object' || (!Array.isArray(data.bookmarks) && !Array.isArray(data.quickLinks) && !Array.isArray(data.todos) && !Array.isArray(data.events))) {
                        alert('导入失败：文件格式不正确，请选择由本页面导出的备份文件。');
                        return;
                    }

                    const replace = confirm('是否覆盖现有数据？\n\n点击"确定"覆盖全部数据；点击"取消"将合并导入的数据（追加到现有数据后）。');

                    const importedEvents = (data.events || []).map(ev => ({
                        ...ev,
                        start: new Date(ev.start),
                        end: ev.end ? new Date(ev.end) : null
                    }));

                    if (replace) {
                        bookmarks = Array.isArray(data.bookmarks) ? data.bookmarks : [];
                        quickLinks = Array.isArray(data.quickLinks) ? data.quickLinks : [];
                        tlState.events = importedEvents;
                        todos = Array.isArray(data.todos) ? data.todos : [];
                        currentCategory = null;
                    } else {
                        // 合并书签：相同分类名合并链接，其余分类追加
                        (data.bookmarks || []).forEach(importedCat => {
                            const existing = bookmarks.find(c => c.category === importedCat.category);
                            if (existing) {
                                existing.links = existing.links.concat(importedCat.links || []);
                            } else {
                                bookmarks.push(importedCat);
                            }
                        });
                        quickLinks = quickLinks.concat(Array.isArray(data.quickLinks) ? data.quickLinks : []);
                        tlState.events = tlState.events.concat(importedEvents);
                        todos = todos.concat(Array.isArray(data.todos) ? data.todos : []);
                    }

                    await saveUserData();
                    renderQuickLinks();
                    setupCategoryFilters();
                    renderBookmarks();
                    populateCategorySelect();
                    renderTimeline();
                    renderTodos();

                    alert('导入成功！');
                } catch (err) {
                    console.error('导入数据错误:', err);
                    alert('导入失败：无法解析文件内容，请确认文件是有效的 JSON 备份文件。');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        };

        // ===== MAIN TABS =====
        function setupMainTabs() {
            document.querySelectorAll('.main-tab').forEach(btn => {
                btn.addEventListener('click', () => {

                    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

        // ===== TIMELINE =====
        function initTimeline() {
            if (tlInitialized) { renderTimeline(); return; }
            tlInitialized = true;
            tlRuler        = document.getElementById('tl-ruler');
            tlTrackWrapper = document.getElementById('tl-track-wrapper');
            tlEventsTop    = document.getElementById('tl-events-top');
            tlEventsBottom = document.getElementById('tl-events-bottom');
            tlTodayMarker  = document.getElementById('tl-today-marker');
            tlDetailPanel  = document.getElementById('tl-detail-panel');
            tlModalOverlay = document.getElementById('tl-modal-overlay');
            tlEmptyHint    = document.getElementById('tl-empty-hint');
            tlScaleLabel   = document.getElementById('tl-scale-label');

            const today = new Date(); today.setHours(0,0,0,0);
            tlState.viewStart = new Date(today.getFullYear() - 2, 0, 1);
            tlState.viewEnd   = new Date(today.getFullYear() + 2, 11, 31);
            renderTimeline();
            bindTimelineEvents();
        }

        function tlGetContainerWidth() {
            return (tlTrackWrapper && tlTrackWrapper.clientWidth) || window.innerWidth;
        }

        function tlDateToX(date) {
            const total = tlState.viewEnd - tlState.viewStart;
            return ((date - tlState.viewStart) / total) * tlGetContainerWidth();
        }

        function tlXToDate(x) {
            const total = tlState.viewEnd - tlState.viewStart;
            return new Date(tlState.viewStart.getTime() + (x / tlGetContainerWidth()) * total);
        }

        function tlVisibleRangeDays() {
            return (tlState.viewEnd - tlState.viewStart) / MS_DAY;
        }

        function tlGetScaleConfig() {
            const d = tlVisibleRangeDays();
            if (d > 365*50) return { major:'decade', minor:'year',  label:'世纪视图' };
            if (d > 365*10) return { major:'year',   minor:'month', label:'十年视图' };
            if (d > 365*2)  return { major:'year',   minor:'month', label:'年视图'  };
            if (d > 120)    return { major:'month',  minor:'week',  label:'月视图'  };
            if (d > 30)     return { major:'week',   minor:'day',   label:'周视图'  };
            return              { major:'day',    minor:'day',   label:'日视图'  };
        }

        function tlIterateTicks(cfg) {
            const ticks = []; const W = tlGetContainerWidth();
            const advance = (d, unit) => {
                const n = new Date(d);
                if (unit==='day')   n.setDate(n.getDate()+1);
                if (unit==='week')  n.setDate(n.getDate()+7);
                if (unit==='month') n.setMonth(n.getMonth()+1);
                if (unit==='year')  n.setFullYear(n.getFullYear()+1);
                if (unit==='decade')n.setFullYear(n.getFullYear()+10);
                return n;
            };
            const snap = (d, unit) => {
                const n = new Date(d); n.setHours(0,0,0,0);
                if (unit==='week')  n.setDate(n.getDate()-n.getDay());
                if (unit==='month') n.setDate(1);
                if (unit==='year')  n.setMonth(0,1);
                if (unit==='decade')n.setFullYear(Math.floor(n.getFullYear()/10)*10,0,1);
                return n;
            };
            const add = (date, type) => {
                const x = tlDateToX(date);
                if (x < -20 || x > W+20) return;
                ticks.push({ x, date: new Date(date), type });
            };
            let cur = snap(new Date(tlState.viewStart), cfg.major);
            while (cur <= tlState.viewEnd) { add(cur,'major'); cur = advance(cur,cfg.major); }
            if (cfg.minor !== cfg.major) {
                cur = snap(new Date(tlState.viewStart), cfg.minor);
                while (cur <= tlState.viewEnd) { add(cur,'minor'); cur = advance(cur,cfg.minor); }
            }
            return ticks;
        }

        function tlFormatTickLabel(date, unit) {
            const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
            if (unit==='decade') return `${Math.floor(y/10)*10}s`;
            if (unit==='year')   return `${y}`;
            if (unit==='month')  return `${y}/${String(m).padStart(2,'0')}`;
            return `${m}/${d}`;
        }

        function renderTimeline() {
            if (!tlRuler) return;
            renderTlRuler(); renderTlEvents(); renderTlTodayMarker(); tlUpdateUI();
        }

        function renderTlRuler() {
            tlRuler.innerHTML = '';
            const cfg = tlGetScaleConfig();
            tlScaleLabel.textContent = cfg.label;
            const seen = new Set();
            tlIterateTicks(cfg).forEach(t => {
                const key = `${t.type}-${Math.round(t.x)}`;
                if (seen.has(key)) return; seen.add(key);
                const el = document.createElement('div');
                el.className = `tl-ruler-tick ${t.type==='major'?'tl-major':'tl-minor'}`;
                el.style.left = t.x + 'px';
                if (t.type==='major') {
                    const lbl = document.createElement('div');
                    lbl.className = 'tl-tick-label';
                    lbl.textContent = tlFormatTickLabel(t.date, cfg.major);
                    el.appendChild(lbl);
                }
                const line = document.createElement('div');
                line.className = 'tl-tick-line';
                el.appendChild(line);
                tlRuler.appendChild(el);
            });
        }

        function renderTlTodayMarker() {
            const today = new Date(); today.setHours(0,0,0,0);
            const x = tlDateToX(today);
            const W = tlGetContainerWidth();
            if (x > 0 && x < W) {
                tlTodayMarker.style.display = 'block';
                tlTodayMarker.style.left = x + 'px';
            } else { tlTodayMarker.style.display = 'none'; }
        }

        function renderTlEvents() {
            tlEventsTop.innerHTML = ''; tlEventsBottom.innerHTML = '';
            const W = tlGetContainerWidth();
            const sorted = [...tlState.events].sort((a,b) => a.start - b.start);
            let topCount=0, botCount=0;
            sorted.forEach(ev => {
                const x = tlDateToX(ev.start);
                if (x < -200 || x > W+200) return;
                if (ev.end && ev.end > ev.start) { renderTlRangeEvent(ev, x, W); return; }
                const isTop = topCount <= botCount;
                const container = isTop ? tlEventsTop : tlEventsBottom;
                isTop ? topCount++ : botCount++;
                const marker = document.createElement('div');
                marker.className = `tl-event-marker ${isTop?'tl-top':'tl-bottom'}`;
                marker.style.left = x + 'px';
                marker.dataset.id = ev.id;
                const stemH = Math.max(40, (container.clientHeight||120)*0.4);
                const dot = document.createElement('div');
                dot.className = 'tl-event-dot'; dot.style.background = ev.color;
                const stem = document.createElement('div');
                stem.className = 'tl-event-stem'; stem.style.height = stemH + 'px';
                const card = document.createElement('div');
                card.className = 'tl-event-card';
                card.style.borderTopColor = ev.color;
                card.style.borderTopWidth = '2px'; card.style.borderTopStyle = 'solid';
                const titleEl = document.createElement('div');
                titleEl.className = 'tl-event-card-title'; titleEl.textContent = ev.title;
                const dateEl = document.createElement('div');
                dateEl.className = 'tl-event-card-date'; dateEl.textContent = tlFormatDate(ev.start);
                card.appendChild(titleEl); card.appendChild(dateEl);
                if (isTop) { marker.appendChild(card); marker.appendChild(stem); marker.appendChild(dot); }
                else       { marker.appendChild(dot);  marker.appendChild(stem); marker.appendChild(card); }
                if (ev.id === tlState.selectedId)
                    dot.style.boxShadow = `0 0 0 3px ${ev.color}, 0 0 12px ${ev.color}`;
                marker.addEventListener('click', e => { e.stopPropagation(); tlSelectEvent(ev.id); });
                container.appendChild(marker);
            });
        }

        function renderTlRangeEvent(ev, x1, W) {
            const x2 = tlDateToX(ev.end);
            const left = Math.max(0,x1), right = Math.min(W,x2);
            if (right <= left) return;
            const el = document.createElement('div');
            el.className = 'tl-event-range';
            el.style.left  = left + 'px'; el.style.width = (right-left) + 'px';
            el.style.background = ev.color; el.textContent = ev.title; el.dataset.id = ev.id;
            if (ev.id === tlState.selectedId) el.style.outline = '2px solid white';
            el.addEventListener('click', e => { e.stopPropagation(); tlSelectEvent(ev.id); });
            tlEventsBottom.appendChild(el);
        }

        function tlSelectEvent(id) {
            tlState.selectedId = id;
            const ev = tlState.events.find(e => e.id === id);
            if (!ev) return;
            document.getElementById('tl-panel-color-bar').style.background = ev.color;
            document.getElementById('tl-panel-date').textContent = ev.end
                ? `${tlFormatDate(ev.start)} — ${tlFormatDate(ev.end)}`
                : tlFormatDate(ev.start);
            document.getElementById('tl-panel-title').textContent = ev.title;
            document.getElementById('tl-panel-desc').textContent  = ev.desc || '（无描述）';
            tlDetailPanel.classList.add('visible');
            renderTimeline();
        }

        function tlClosePanel() {
            tlState.selectedId = null;
            tlDetailPanel.classList.remove('visible');
            renderTimeline();
        }

        function tlFormatDate(d) {
            if (!d) return '';
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function tlOpenModal(editId=null) {
            tlState.editingId = editId;
            const ev = editId ? tlState.events.find(e => e.id===editId) : null;
            document.getElementById('tl-modal-title').textContent = ev ? '编辑事件' : '添加事件';
            document.getElementById('tl-input-title').value = ev ? ev.title : '';
            document.getElementById('tl-input-start').value = ev ? tlFormatDate(ev.start) : tlFormatDate(new Date());
            document.getElementById('tl-input-end').value   = ev && ev.end ? tlFormatDate(ev.end) : '';
            document.getElementById('tl-input-desc').value  = ev ? (ev.desc||'') : '';
            const color = ev ? ev.color : '#4f8ef7';
            tlState.selectedColor = color;
            document.querySelectorAll('.tl-color-swatch').forEach(sw => {
                sw.classList.toggle('selected', sw.dataset.color === color);
            });
            tlModalOverlay.classList.add('visible');
            document.getElementById('tl-input-title').focus();
        }

        function tlCloseModal() {
            tlModalOverlay.classList.remove('visible');
            tlState.editingId = null;
        }

        async function tlSaveModal() {
            const title = document.getElementById('tl-input-title').value.trim();
            const startVal = document.getElementById('tl-input-start').value;
            if (!title) { tlShake(document.getElementById('tl-input-title')); return; }
            if (!startVal) { tlShake(document.getElementById('tl-input-start')); return; }
            const start = new Date(startVal + 'T00:00:00');
            const endVal = document.getElementById('tl-input-end').value;
            const end = endVal ? new Date(endVal + 'T00:00:00') : null;
            const desc = document.getElementById('tl-input-desc').value.trim();
            const color = tlState.selectedColor;
            if (tlState.editingId) {
                const idx = tlState.events.findIndex(e => e.id === tlState.editingId);
                if (idx !== -1) {
                    tlState.events[idx] = { ...tlState.events[idx], title, start, end, desc, color };
                    if (tlState.selectedId === tlState.editingId) tlSelectEvent(tlState.editingId);
                }
            } else {
                tlState.events.push({ id: Date.now()+Math.random(), title, start, end, desc, color });
                tlCenterOnDate(start);
            }
            await saveUserData();
            tlCloseModal();
            renderTimeline();
        }

        function tlShake(el) {
            el.style.animation = 'none'; el.offsetHeight;
            el.style.animation = 'tlShakeAnim 0.3s ease';
            setTimeout(() => { el.style.animation = ''; }, 400);
        }

        function tlZoom(factor) {
            const center = new Date((tlState.viewStart.getTime()+tlState.viewEnd.getTime())/2);
            const half = (tlState.viewEnd-tlState.viewStart)/2 * factor;
            const clamped = Math.max(MS_DAY*7, Math.min(MS_DAY*365*100, half));
            tlState.viewStart = new Date(center.getTime()-clamped);
            tlState.viewEnd   = new Date(center.getTime()+clamped);
            renderTimeline();
        }

        function tlPan(dx) {
            const total = tlState.viewEnd - tlState.viewStart;
            const dt = -(dx/tlGetContainerWidth())*total;
            tlState.viewStart = new Date(tlState.viewStart.getTime()+dt);
            tlState.viewEnd   = new Date(tlState.viewEnd.getTime()+dt);
            renderTimeline();
        }

        function tlGoToToday() {
            const t = new Date(); t.setHours(0,0,0,0); tlCenterOnDate(t);
        }

        function tlCenterOnDate(date) {
            const half = (tlState.viewEnd-tlState.viewStart)/2;
            tlState.viewStart = new Date(date.getTime()-half);
            tlState.viewEnd   = new Date(date.getTime()+half);
            renderTimeline();
        }

        function tlUpdateUI() {
            if (tlEmptyHint)
                tlEmptyHint.classList.toggle('hidden', tlState.events.length > 0);
        }

        function bindTimelineEvents() {
            document.getElementById('tl-btn-zoom-in').addEventListener('click', () => tlZoom(0.5));
            document.getElementById('tl-btn-zoom-out').addEventListener('click', () => tlZoom(2));
            document.getElementById('tl-btn-today').addEventListener('click', tlGoToToday);
            document.getElementById('tl-btn-add-event').addEventListener('click', () => tlOpenModal());
            document.getElementById('tl-panel-close').addEventListener('click', tlClosePanel);
            document.getElementById('tl-panel-edit').addEventListener('click', () => {
                if (tlState.selectedId) tlOpenModal(tlState.selectedId);
            });
            document.getElementById('tl-panel-delete').addEventListener('click', async () => {
                if (tlState.selectedId) {
                    tlState.events = tlState.events.filter(e => e.id !== tlState.selectedId);
                    await saveUserData(); tlClosePanel(); renderTimeline();
                }
            });
            document.getElementById('tl-modal-close').addEventListener('click', tlCloseModal);
            document.getElementById('tl-btn-cancel').addEventListener('click', tlCloseModal);
            document.getElementById('tl-btn-save').addEventListener('click', tlSaveModal);
            tlModalOverlay.addEventListener('click', e => { if (e.target===tlModalOverlay) tlCloseModal(); });
            document.querySelectorAll('.tl-color-swatch').forEach(sw => {
                sw.addEventListener('click', () => {
                    document.querySelectorAll('.tl-color-swatch').forEach(s => s.classList.remove('selected'));
                    sw.classList.add('selected');
                    tlState.selectedColor = sw.dataset.color;
                });
            });
            document.addEventListener('keydown', e => {
                const inInput = ['INPUT','TEXTAREA'].includes(document.activeElement?.tagName);
                if (e.key==='Escape') {
                    if (tlModalOverlay.classList.contains('visible')) { tlCloseModal(); return; }
                    if (tlState.selectedId) { tlClosePanel(); return; }
                }
                if (!inInput && (e.key==='+'||e.key==='=')) tlZoom(0.5);
                if (!inInput && e.key==='-') tlZoom(2);
                if (e.key==='Enter' && tlModalOverlay.classList.contains('visible')) tlSaveModal();
            });
            tlTrackWrapper.addEventListener('mousedown', e => {
                if (e.button!==0) return;
                tlState.isDragging = true; tlState.dragStartX = e.clientX;
                tlState.dragStartMs = tlState.viewStart.getTime();
                tlTrackWrapper.style.cursor = 'grabbing';
            });
            document.addEventListener('mousemove', e => {
                if (!tlState.isDragging) return;
                const dx = e.clientX - tlState.dragStartX;
                const total = tlState.viewEnd - tlState.viewStart;
                const dt = -(dx/tlGetContainerWidth())*total;
                tlState.viewStart = new Date(tlState.dragStartMs+dt);
                tlState.viewEnd   = new Date(tlState.dragStartMs+dt+total);
                renderTimeline();
            });
            document.addEventListener('mouseup', () => {
                tlState.isDragging = false;
                tlTrackWrapper.style.cursor = 'grab';
            });
            tlTrackWrapper.addEventListener('click', e => {
                if (e.target===tlTrackWrapper || e.target.classList.contains('tl-track-inner') ||
                    e.target.classList.contains('tl-events-top') || e.target.classList.contains('tl-events-bottom') ||
                    e.target.classList.contains('tl-axis-line-wrapper') || e.target.classList.contains('tl-axis-line')) {
                    tlClosePanel();
                }
            });
            tlRuler.parentElement.addEventListener('wheel', e => {
                e.preventDefault(); tlZoom(e.deltaY>0?1.2:0.83);
            }, { passive: false });
            tlTrackWrapper.addEventListener('wheel', e => {
                e.preventDefault();
                if (e.ctrlKey||e.metaKey) tlZoom(e.deltaY>0?1.2:0.83);
                else tlPan(e.deltaY*2);
            }, { passive: false });
            let touchStartX=0, touchStartMs=0, lastTouchDist=0;
            tlTrackWrapper.addEventListener('touchstart', e => {
                if (e.touches.length===1) { touchStartX=e.touches[0].clientX; touchStartMs=tlState.viewStart.getTime(); }
                else if (e.touches.length===2) {
                    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
                    lastTouchDist=Math.hypot(dx,dy);
                }
            }, { passive: true });
            tlTrackWrapper.addEventListener('touchmove', e => {
                if (e.touches.length===1) {
                    const dx=e.touches[0].clientX-touchStartX, total=tlState.viewEnd-tlState.viewStart;
                    const dt=-(dx/tlGetContainerWidth())*total;
                    tlState.viewStart=new Date(touchStartMs+dt); tlState.viewEnd=new Date(touchStartMs+dt+total);
                    renderTimeline();
                } else if (e.touches.length===2) {
                    const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
                    const dist=Math.hypot(dx,dy);
                    if (lastTouchDist>0) tlZoom(lastTouchDist/dist);
                    lastTouchDist=dist;
                }
            }, { passive: true });
            window.addEventListener('resize', renderTimeline);

            // Inject shake keyframe
            const sty = document.createElement('style');
            sty.textContent = `@keyframes tlShakeAnim { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }`;
            document.head.appendChild(sty);
        }

        // ===== TODOS =====
        function renderTodos() {
            const list = document.getElementById('todoList');
            const stats = document.getElementById('todoStats');
            const footer = document.getElementById('todoFooter');
            if (!list) return;

            const active = todos.filter(t => !t.completed).length;
            const hasCompleted = todos.some(t => t.completed);
            stats.textContent = `${active} 项未完成`;
            footer.style.display = hasCompleted ? 'block' : 'none';

            let filtered = todos;
            if (todoFilter === 'active')    filtered = todos.filter(t => !t.completed);
            if (todoFilter === 'completed') filtered = todos.filter(t => t.completed);

            if (filtered.length === 0) {
                list.innerHTML = `<div class="todo-empty"><div class="todo-empty-icon">🎉</div>${todoFilter==='completed'?'还没有完成的任务':todoFilter==='active'?'所有任务都完成了！':'点击上方添加你的第一个待办事项'}</div>`;
                return;
            }

            list.innerHTML = '';
            filtered.forEach(todo => {
                const item = document.createElement('div');
                item.className = 'todo-item' + (todo.completed ? ' completed' : '');
                item.innerHTML = `
                    <button class="todo-checkbox" data-id="${todo.id}" title="标记完成">${todo.completed?'✓':''}</button>
                    <span class="todo-text">${escapeHtml(todo.text)}</span>
                    <span class="todo-priority-badge ${todo.priority}">${todo.priority==='high'?'高优先级':todo.priority==='low'?'低优先级':''}</span>
                    <button class="todo-delete-btn" data-id="${todo.id}" title="删除">🗑️</button>
                `;
                list.appendChild(item);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function setupTodoHandlers() {
            const addBtn = document.getElementById('todoAddBtn');
            const input  = document.getElementById('todoInput');
            if (!addBtn) return;

            const addTodo = async () => {
                const text = input.value.trim();
                if (!text) { input.focus(); return; }
                const priority = document.getElementById('todoPriority').value;
                todos.unshift({ id: `${Date.now()}_${Math.random().toString(36).slice(2)}`, text, priority, completed: false, createdAt: new Date().toISOString() });
                input.value = '';
                await saveUserData();
                renderTodos();
            };

            addBtn.addEventListener('click', addTodo);
            input.addEventListener('keydown', e => { if (e.key==='Enter') addTodo(); });

            document.getElementById('todoList').addEventListener('click', async e => {
                const checkBtn = e.target.closest('.todo-checkbox');
                const delBtn   = e.target.closest('.todo-delete-btn');
                if (checkBtn) {
                    const id = checkBtn.dataset.id;
                    const t = todos.find(t => String(t.id) === id);
                    if (t) { t.completed = !t.completed; await saveUserData(); renderTodos(); }
                }
                if (delBtn) {
                    const id = delBtn.dataset.id;
                    todos = todos.filter(t => String(t.id) !== id);
                    await saveUserData(); renderTodos();
                }
            });

            document.querySelectorAll('.todo-filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.todo-filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    todoFilter = btn.dataset.filter;
                    renderTodos();
                });
            });

            document.getElementById('clearCompletedBtn').addEventListener('click', async () => {
                todos = todos.filter(t => !t.completed);
                await saveUserData(); renderTodos();
            });
        }
    </script>



</body></html>
